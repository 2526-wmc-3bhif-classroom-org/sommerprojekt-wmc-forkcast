<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
    <style>
        p {
            color: #E6E4E3;
            line-height: 1.5;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #0A0B11;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #161616;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #232323;
        }
        .header h1 {
            color: #333333;
            margin: 0;
        }
        .content {
            padding: 20px 0;
            text-align: center;
        }
        .greeting {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #999999;
            margin-top: 20px;
            border-top: 1px solid #232323;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="cid:logo" alt="logo" height="100">
        </div>
        <div class="content">
            <p class="greeting">{{greeting}}</p>
            <p>{{intro}}</p>
            <p>{{outro}}</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 Forkcast Solutions. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
