        '401':
          description: JWT cookie is missing
        '403':
          description: JWT cookie is invalid
  /users/me/favorites:
    get:
      summary: Get favorite recipes
      responses:
        '409':
          description: Route is not implemented yet
        '401':
          description: JWT cookie is missing
        '403':
          description: JWT cookie is invalid
    post:
      summary: Add recipe to favorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFavoriteRequest'
      responses:
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: Route is not implemented yet
        '401':
          description: JWT cookie is missing
        '403':
          description: JWT cookie is invalid
  /users/me/favorites/{recipeId}:
    delete:
      summary: Remove recipe from favorites
      parameters:
        - in: path
          name: recipeId
          required: true
          schema:
            type: integer
      responses:
        '409':
