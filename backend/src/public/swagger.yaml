openapi: 3.0.0
info:
  title: Forkcast API
  description: API Documentation for Forkcast Application
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
        - profilePicture
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        profilePicture:
          type: string
          format: uri
          nullable: true
    LoginResponse:
      type: object
      required:
        - user
        - token
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT Bearer token
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Must satisfy the backend strong-password validation.
    LoginRequest:
      type: object
      required:
        - password
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string
          format: password
    VerifyRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
          description: 6-digit verification code
    UpdateProfileRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        profilePicture:
          type: string
          format: uri
    AddFriendRequest:
      type: object
      required:
        - friendId
      properties:
        friendId:
          type: integer
    AddFavoriteRequest:
      type: object
      required:
        - recipeId
      properties:
        recipeId:
          type: integer
    AddCalendarEntryRequest:
      type: object
      required:
        - recipeId
        - date
      properties:
        recipeId:
          type: integer
        date:
          type: string
          format: date-time
          description: ISO 8601 date string.
    UpdateNotificationRequest:
      type: object
      required:
        - isRead
      properties:
        isRead:
          type: boolean
    ValidationErrorItem:
      type: object
      properties:
        type:
          type: string
        value:
          nullable: true
        msg:
          type: string
        path:
          type: string
        location:
          type: string
    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
    MessageResponse:
      type: object
      properties:
        message:
          type: string
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully (Pending Verification)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal server error
  /auth/login:
    post:
      summary: Login a user and return a JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal server error
  /auth/verify:
    post:
      summary: Verify email with code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Code verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Invalid code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal server error
  /recipes:
    get:
      summary: Get all recipes
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search term for recipes.
      responses:
        '200':
          description: List of recipes
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authentication
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /recipes/{id}:
    get:
      summary: Get single recipe details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Recipe details
        '400':
          description: Invalid recipe ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Missing or invalid authentication
        '403':
          description: Forbidden
        '404':
          description: Recipe not found
        '500':
          description: Internal server error
  /users/me:
    get:
      summary: Get current user profile
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing or invalid authentication
        '403':
          description: Forbidden
        '404':
          description: User not found
        '500':
          description: Internal server error
    put:
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: Route is not implemented yet
        '401':
          description: Missing or invalid authentication
        '403':
          description: Forbidden
  /users/me/friends:
    get:
      summary: Get friend list
      responses:
        '409':
          description: Route is not implemented yet
        '401':
          description: Missing or invalid authentication
        '403':
