    post:
      summary: Add a friend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFriendRequest'
      responses:
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: Route is not implemented yet
        '401':
          description: JWT cookie is missing
        '403':
          description: JWT cookie is invalid
  /users/me/friends/{friendId}:
    delete:
      summary: Remove a friend
      parameters:
        - in: path
          name: friendId
          required: true
          schema:
            type: integer
      responses:
        '409':
