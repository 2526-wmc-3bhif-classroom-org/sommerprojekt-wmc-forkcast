        '401':
          description: JWT cookie is missing
        '403':
          description: JWT cookie is invalid
  /users/me/calendar:
    get:
      summary: Get calendar entries
      responses:
        '409':
          description: Route is not implemented yet
        '401':
          description: JWT cookie is missing
        '403':
          description: JWT cookie is invalid
    post:
      summary: Add calendar entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
